name: Blog organizer & scheduled publish jobs
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: owl-blog-jobs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run queued blog jobs if configured
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET missing; skipping blog jobs run."
            exit 0
          fi
          curl -fsSL -X GET "${SITE_URL%/}/api/payload-jobs/run?limit=10" \
            -H "Authorization: Bearer $CRON_SECRET"
