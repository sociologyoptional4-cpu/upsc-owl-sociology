name: Daily current affairs
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without publishing drafts
        type: boolean
        required: true
        default: true
concurrency:
  group: aum-ai-pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx src/pipeline/run-daily.ts
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SITE_URL: ${{ secrets.SITE_URL }}
          AI_BOT_API_KEY: ${{ secrets.AI_BOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          WRITER_MODEL: ${{ secrets.WRITER_MODEL }}
          SCORER_MODEL: ${{ secrets.SCORER_MODEL }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          PRICE_OPENAI_INPUT: ${{ secrets.PRICE_OPENAI_INPUT }}
          PRICE_OPENAI_OUTPUT: ${{ secrets.PRICE_OPENAI_OUTPUT }}
          PRICE_OPENAI_EMBEDDING: ${{ secrets.PRICE_OPENAI_EMBEDDING }}
          PRICE_DEEPSEEK_INPUT: ${{ secrets.PRICE_DEEPSEEK_INPUT }}
          PRICE_DEEPSEEK_OUTPUT: ${{ secrets.PRICE_DEEPSEEK_OUTPUT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
